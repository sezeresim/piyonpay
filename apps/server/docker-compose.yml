# Mongo-only helper for local API development.
# Full stack: use the root docker-compose.yml (`docker compose up`).
services:
  mongo:
    image: mongo:7
    ports:
      - '27018:27017'
    volumes:
      - piyonpay-mongo:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  piyonpay-mongo:
