# Mongo-only helper for local API development (single-node replica set).
# Full stack: use the root docker-compose.yml (`docker compose up`).
services:
  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27019:27017'
    volumes:
      - piyonpay-mongo:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 }).ok']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try {
            const s = rs.status();
            if (s.ok) quit(0);
          } catch (e) {}
          rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] });
        '
        for i in $$(seq 1 30); do
          if mongosh --host mongo:27017 --quiet --eval 'quit(rs.status().ok === 1 ? 0 : 1)'; then
            echo "Replica set ready"
            exit 0
          fi
          sleep 1
        done
        echo "Replica set init timed out" >&2
        exit 1

volumes:
  piyonpay-mongo:
