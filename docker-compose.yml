# Full stack — local + same Wi‑Fi sharing
# Usage:
#   docker compose up --build
# UI (phones on LAN): http://YOUR_LAN_IP:5173
# API (optional direct): http://YOUR_LAN_IP:3000
# Mongo (host only): localhost:27019

services:
  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27019:27017'
    volumes:
      - piyonpay-mongo:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 }).ok']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try {
            const s = rs.status();
            if (s.ok) quit(0);
          } catch (e) {}
          rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
        '
        for i in $$(seq 1 30); do
          if mongosh --host mongo:27017 --quiet --eval 'quit(rs.status().ok === 1 ? 0 : 1)'; then
            echo "Replica set ready"
            exit 0
          fi
          sleep 1
        done
        echo "Replica set init timed out" >&2
        exit 1

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - '3000:3000'
    environment:
      MONGODB_URI: mongodb://mongo:27017/piyonpay?replicaSet=rs0&directConnection=true
      PORT: '3000'
      ROOM_TTL_HOURS: '24'
      ROOM_ADMIN_HOLD_MINUTES: '15'
      THROTTLE_TTL_MS: '60000'
      THROTTLE_LIMIT: '60'
      THROTTLE_TRANSFER_LIMIT: '20'
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Leave empty so the UI talks to same origin (/api + /socket.io via nginx).
      # Works on localhost and on phones over Wi‑Fi without rebuilding for a LAN IP.
      args:
        VITE_API_BASE: ''
        VITE_SOCKET_BASE: ''
    ports:
      - '5173:80'
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  piyonpay-mongo:
