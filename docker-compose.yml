services:
  mongo:
    image: mongo:7
    ports:
      - '27018:27017'
    volumes:
      - piyonpay-mongo:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - '3000:3000'
    environment:
      MONGODB_URI: mongodb://mongo:27017/piyonpay
      PORT: '3000'
      ROOM_TTL_HOURS: '24'
      ROOM_ADMIN_HOLD_MINUTES: '15'
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '5173:80'
    depends_on:
      - server

volumes:
  piyonpay-mongo:
