services:
  mongo:
    image: mongo:7
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27019:27017'
    volumes:
      - piyonpay-mongo:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 }).ok']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try {
            const s = rs.status();
            if (s.ok) quit(0);
          } catch (e) {}
          rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
        '
        for i in $$(seq 1 30); do
          if mongosh --host mongo:27017 --quiet --eval 'quit(rs.status().ok === 1 ? 0 : 1)'; then
            echo "Replica set ready"
            exit 0
          fi
          sleep 1
        done
        echo "Replica set init timed out" >&2
        exit 1

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - '3000:3000'
    environment:
      MONGODB_URI: mongodb://mongo:27017/piyonpay?replicaSet=rs0&directConnection=true
      PORT: '3000'
      ROOM_TTL_HOURS: '24'
      ROOM_ADMIN_HOLD_MINUTES: '15'
      THROTTLE_TTL_MS: '60000'
      THROTTLE_LIMIT: '60'
      THROTTLE_TRANSFER_LIMIT: '20'
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '5173:80'
    depends_on:
      - server

volumes:
  piyonpay-mongo:
