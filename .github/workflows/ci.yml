name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    name: Lint · Build · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm fmt:check

      - name: Build
        run: pnpm build

      - name: Unit tests
        env:
          NODE_OPTIONS: '--no-experimental-webstorage'
        run: pnpm --filter @piyonpay/server test

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: lint-build-test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Mongo replica set
        run: docker compose -f apps/server/docker-compose.yml up -d mongo

      - name: Wait for Mongo replica set
        run: |
          for i in $(seq 1 40); do
            if docker compose -f apps/server/docker-compose.yml exec -T mongo \
              mongosh --quiet --eval 'quit(rs.status().ok === 1 ? 0 : 1)'; then
              exit 0
            fi
            sleep 2
          done
          echo 'Mongo replica set did not become healthy in time' >&2
          exit 1

      - name: Build shared
        run: pnpm --filter @piyonpay/shared build

      - name: Install Playwright browsers
        run: pnpm --filter @piyonpay/e2e exec playwright install --with-deps

      - name: Run Playwright tests
        working-directory: apps/e2e
        env:
          MONGODB_URI: mongodb://127.0.0.1:27018/piyonpay?directConnection=true
        run: pnpm test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 30
