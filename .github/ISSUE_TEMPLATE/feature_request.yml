name: Feature Request
description: Suggest a new feature or improvement
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Share an idea that would make PiyonPay better for tabletop nights.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve?
      placeholder: As a banker, I want…
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about (optional)
  - type: dropdown
    id: priority
    attributes:
      label: Priority (your view)
      options:
        - Nice to have
        - Important
        - Critical for my use case
    validations:
      required: true
